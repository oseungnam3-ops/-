<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>성경 삼국지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Song+Myung&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  /* 단일 테마: 모바일 전략 게임풍 — 짙은 남색 금속 패널과 금박 테두리. 의도적으로 다크 하나만 사용 */
  :root {
    color-scheme: dark;
    --bg: #0b0f19;
    --navy-9: #0e1320;
    --navy-8: #161d2e;
    --navy-7: #1f2840;
    --navy-6: #28324c;
    --steel: #3a4868;
    --steel-hi: #56688f;
    --line: #34405c;
    --ink: #eef0f5;
    --mute: #9aa3b8;
    --gold: #e6b64a;
    --gold-hi: #ffd978;
    --gold-dk: #7a5210;
    --red: #b3322a;
    --red-hi: #dc4a3a;
    --blue: #3d9be0;
    --blue-hi: #7cc4ff;
    --green: #7ed957;
    --faith: #ffb85c;
    --display: 'Song Myung', 'Nanum Myeongjo', 'Batang', serif;
    --body: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', monospace;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.55 var(--body); overflow: hidden; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, select:focus-visible, input:focus-visible, .city:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 2px; }
  h1, h2, h3 { font-family: var(--display); font-weight: 400; text-wrap: balance; margin: 0; }
  .mute { color: var(--mute); }
  .eyebrow { font-size: 11px; letter-spacing: .14em; color: var(--gold); margin: 0 0 4px; }
  small { color: var(--mute); }

  /* ---------- 공용 버튼 ---------- */
  .btn { position: relative; padding: 9px 18px; border-radius: 3px; border: 1px solid var(--steel-hi); background: linear-gradient(#3b4a6d, #243049); color: var(--ink); font-weight: 600; box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 2px 0 #0a0e17; }
  .btn:hover { border-color: var(--gold); }
  .btn:disabled { opacity: .42; filter: grayscale(.7); cursor: default; box-shadow: none; }
  .btn.primary, .gbtn { background: linear-gradient(#ffe08a, #e2a93a 55%, #b57a1c); color: #3a2507; border: 1px solid #ffeab0; box-shadow: 0 0 0 2px #4e3207, 0 0 16px rgba(255, 196, 80, .45), inset 0 1px 0 #fff4c8; text-shadow: 0 1px 0 rgba(255,255,255,.4); }
  .btn.primary::before, .btn.primary::after, .gbtn::before, .gbtn::after { content: ''; position: absolute; width: 10px; height: 10px; border: 2px solid var(--gold-hi); pointer-events: none; }
  .btn.primary::before, .gbtn::before { left: -7px; top: -7px; border-right: 0; border-bottom: 0; }
  .btn.primary::after, .gbtn::after { right: -7px; bottom: -7px; border-left: 0; border-top: 0; }
  .btn.danger { background: linear-gradient(#c4463a, #7e1e18); border-color: #f08a7a; color: #fff; }
  .btn.primary.danger { background: linear-gradient(#ff8a6a, #c4332a 55%, #86201a); color: #fff; border-color: #ffc0b0; text-shadow: none; }
  .gbtn { display: inline-grid; justify-items: center; gap: 2px; padding: 12px 30px; border-radius: 3px; position: relative; font-family: var(--display); font-size: 22px; }
  .gbtn small { font-family: var(--body); font-size: 12px; color: #5a3a0a; }

  /* ---------- 타이틀 ---------- */
  #title { position: fixed; inset: 0; overflow-y: auto; padding-inline: 16px; padding-block: 0 48px; background: var(--bg); }
  .title-art { position: fixed; inset: 0; background: radial-gradient(ellipse at 50% 20%, #3b4a6d 0%, #0b0f19 70%); background-size: cover; background-position: center top; }
  .title-art::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(11,15,25,.15) 0%, rgba(11,15,25,.55) 35%, rgba(11,15,25,.96) 70%); }
  .title-inner { position: relative; max-width: 1040px; margin: 0 auto; padding-top: clamp(80px, 22vh, 220px); }
  #title h1 { font-size: clamp(56px, 12vw, 110px); line-height: 1; color: var(--gold-hi); letter-spacing: .04em; text-shadow: 0 2px 0 #6b4a0e, 0 0 30px rgba(255, 200, 90, .45); }
  .lede { font-size: 17px; max-width: 34em; margin: 14px 0 26px; color: #dfe3ec; text-shadow: 0 1px 6px #000; }
  .sec { font-size: 24px; margin: 38px 0 14px; color: var(--gold); }
  .scns { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 16px; }
  .scn { background: linear-gradient(#232c42, #171e30); border: 1px solid var(--line); box-shadow: inset 0 0 0 1px #0b0f18; border-radius: 4px; overflow: hidden; display: flex; flex-direction: column; }
  .scn-art { position: relative; aspect-ratio: 16 / 8; max-width: 100%; background: linear-gradient(135deg, #3a4868, #1b2233); background-size: cover; background-position: center; display: flex; flex-direction: column; justify-content: flex-end; padding: 14px; gap: 2px; }
  .scn-art::before { content: ''; position: absolute; inset: 0; background: linear-gradient(transparent 30%, rgba(8, 11, 19, .9)); }
  .scn-art > * { position: relative; }
  .scn h3 { font-size: 28px; color: #fff; text-shadow: 0 2px 6px #000; }
  .yr { font: 600 12px var(--mono); color: var(--gold-hi); }
  .ref { font-size: 12px; color: #c9cfdd; }
  .scn > p { margin: 12px 16px 0; color: #c9cfdd; font-size: 13.5px; }
  .facs { display: grid; gap: 6px; padding: 12px 16px 16px; }
  details .facs { padding: 6px 0 0; }
  .facbtn { display: grid; grid-template-columns: 26px 1fr auto; align-items: center; gap: 10px; text-align: left; padding: 8px 12px; background: linear-gradient(#2c3753, #1d2539); border: 1px solid var(--line); border-radius: 3px; }
  .facbtn i { width: 22px; height: 26px; display: grid; place-items: center; font: 400 14px var(--display); font-style: normal; background: var(--fc); color: #fff; clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 80%, 0 100%); }
  .facbtn.story { border-color: rgba(230, 182, 74, .6); }
  .facbtn:hover { border-color: var(--gold-hi); }
  details summary { color: var(--mute); cursor: pointer; font-size: 13px; padding: 4px 0; }
  .foot { margin-top: 30px; font-size: 12px; color: var(--mute); position: relative; }

  /* ---------- 게임 화면 ---------- */
  #app { position: fixed; inset: 0; }
  #mapWrap { position: absolute; inset: 0; background: #1b5064; overflow: hidden; }
  #map { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; user-select: none; }
  .geo { fill: #fff6dc; opacity: .8; font: italic 24px var(--display); letter-spacing: .3em; pointer-events: none; paint-order: stroke; stroke: rgba(20, 30, 40, .55); stroke-width: 2px; }
  .geo.sm { font-size: 11px; letter-spacing: .2em; opacity: .9; fill: #fdf3d6; }
  .road-b { stroke: #5c4c30; stroke-width: 5.5; stroke-linecap: round; opacity: .55; }
  .road { stroke: #d9cba4; stroke-width: 3.4; stroke-linecap: round; stroke-dasharray: 5 1.6; }
  .road.hot { stroke: var(--gold-hi); }
  .city { cursor: pointer; }
  .city:hover .cname { fill: var(--gold-hi); }
  .cname { fill: #fff; font: 700 10.5px var(--body); paint-order: stroke; stroke: #15110b; stroke-width: 2px; pointer-events: none; }
  .cplate { fill: rgba(10, 14, 23, .74); stroke: rgba(230, 182, 74, .45); stroke-width: .6; }
  .city.mine .cplate { stroke: #ffd978; stroke-width: 1; }
  .cfac { fill: #e8d9ae; font: 500 6.6px var(--body); pointer-events: none; }
  .geo.sm2 { font-size: 12px; letter-spacing: .1em; font-style: italic; }
  #map.art-on .city:not(.nospr) .cicon { display: none; }
  #map:not(.art-on) .ctown { display: none; }
  .ctown { pointer-events: none; }
  .cgov { fill: #e2dccb; font: 500 7.4px var(--body); paint-order: stroke; stroke: #15110b; stroke-width: 2.4px; pointer-events: none; }
  .cbadge { fill: #fff; font: 9px var(--display); text-anchor: middle; pointer-events: none; }
  .csold { fill: #ffe39a; font: 600 7.5px var(--mono); pointer-events: none; }
  .city.sel .cname { fill: var(--gold-hi); }
  .bracket { animation: pulse 1.4s ease-in-out infinite; }
  .qmark { animation: bob 1.6s ease-in-out infinite; }
  .qbang { fill: #fff; font: 700 13px var(--body); text-anchor: middle; }
  .qlabel { fill: var(--gold-hi); font: 700 9px var(--body); text-anchor: middle; paint-order: stroke; stroke: #15110b; stroke-width: 2.6px; }
  @keyframes pulse { 50% { opacity: .4; } }
  @keyframes bob { 50% { transform: translate(0, -44px); } }

  /* 상단 HUD */
  .hud-top { position: absolute; left: 0; right: 0; top: 0; padding-top: env(safe-area-inset-top, 0px); pointer-events: none; }
  .hud-top > * { pointer-events: auto; }
  .res-bar { display: flex; justify-content: space-between; gap: 0; padding-inline: 16px; background: linear-gradient(#232b3f, #0f1422); border-bottom: 1px solid #3a4666; box-shadow: 0 2px 10px rgba(0,0,0,.5); overflow-x: auto; scrollbar-width: none; }
  .res { display: flex; align-items: center; gap: 6px; padding: 7px 10px; border-right: 1px solid #2c3650; white-space: nowrap; }
  .res:last-child { border-right: 0; }
  .res i { width: 22px; height: 22px; display: block; }
  .res i svg { width: 100%; height: 100%; }
  .res b { font: 600 15px var(--mono); font-variant-numeric: tabular-nums; }
  .res small { font-size: 10px; }
  .hud-row { display: flex; align-items: flex-start; gap: 8px; padding: 6px 16px 0; pointer-events: none; }
  .hud-row > * { pointer-events: auto; }
  .lord { display: grid; justify-items: center; gap: 0; padding: 0; background: none; border: 0; }
  .lord-img { position: relative; width: 66px; height: 78px; display: block; border: 2px solid var(--gold); box-shadow: 0 0 0 1px #000, 0 4px 10px rgba(0,0,0,.6); background: #1b2233; overflow: hidden; }
  .lord-img em { position: absolute; right: 2px; bottom: 1px; font: 700 13px var(--mono); font-style: normal; color: #fff; text-shadow: 0 0 3px #000, 0 0 3px #000; }
  .lord-name { font: 700 12px var(--body); background: rgba(10, 14, 23, .8); padding: 1px 8px; margin-top: -2px; border: 1px solid #3a4666; }
  .lord-meta { display: grid; gap: 4px; flex: 1; min-width: 0; max-width: 360px; }
  .lm-row { display: flex; align-items: center; gap: 8px; background: linear-gradient(90deg, rgba(14,19,32,.92), rgba(14,19,32,.55)); padding: 3px 10px 3px 6px; border: 1px solid #2c3650; white-space: nowrap; overflow: hidden; }
  .lm-row b { font-size: 13px; }
  .stage { font-size: 11px; color: var(--gold-hi); }
  .season { font-size: 12px; }
  .turn { font: 600 11px var(--mono); color: var(--mute); }
  .fbadge { display: inline-grid; place-items: center; width: 20px; height: 24px; background: var(--fc); color: #fff; font: 13px var(--display); clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 80%, 0 100%); flex: none; margin-right: 4px; vertical-align: middle; }
  .power { display: flex; align-items: center; gap: 6px; padding: 3px 12px; background: linear-gradient(90deg, #9e1e18, #d8402f 60%, rgba(216,64,47,.4)); border: 1px solid #ff8a70; font: 700 16px var(--mono); color: #fff; text-shadow: 0 1px 2px #000; width: max-content; min-width: 140px; }
  .power i { width: 18px; height: 18px; }
  .power i svg { width: 100%; height: 100%; }
  .minimap { margin-left: auto; width: 116px; height: 146px; padding: 0; border: 2px solid #56688f; background: #0e1320; box-shadow: 0 0 0 1px #000, 0 4px 12px rgba(0,0,0,.6); flex: none; }
  .minimap svg { width: 100%; height: 100%; display: block; }

  .side-btns { display: grid; gap: 8px; width: max-content; padding: 10px 0 0 16px; pointer-events: none; }
  .side-btns button { pointer-events: auto; display: grid; justify-items: center; gap: 0; width: 60px; padding: 5px 0 3px; background: linear-gradient(#26304a, #10151f); border: 1px solid #56688f; border-radius: 8px; box-shadow: 0 0 0 1px #000, 0 3px 8px rgba(0,0,0,.55); }
  .side-btns svg { width: 30px; height: 30px; }
  .side-btns span { font: 11.5px var(--display); color: #eef0f5; text-shadow: 0 1px 2px #000; white-space: nowrap; }
  .side-btns button:hover { border-color: var(--gold); }
  /* 하단 HUD */
  .hud-bottom { position: absolute; left: 0; right: 0; bottom: 0; padding-bottom: env(safe-area-inset-bottom, 0px); pointer-events: none; }
  .hud-bottom > * { pointer-events: auto; }
  .quest-bar { display: flex; align-items: center; gap: 10px; margin: 0 16px 8px; }
  .qicon { width: 58px; height: 58px; border-radius: 50%; flex: none; border: 2px solid #8793b3; background: radial-gradient(circle at 40% 35%, #4d5d85, #1a2238 70%); font: 15px var(--display); color: #fff; box-shadow: 0 3px 8px rgba(0,0,0,.6); }
  .qtext { flex: 1; min-width: 0; display: grid; gap: 1px; text-align: left; padding: 8px 18px; background: linear-gradient(90deg, rgba(10,14,23,.95), rgba(26,33,52,.88) 70%, rgba(10,14,23,.6)); border: 1px solid #3a4666; clip-path: polygon(0 0, 97% 0, 100% 50%, 97% 100%, 0 100%); }
  .qch { font: 13px var(--display); color: var(--gold-hi); }
  .qgoal { font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .qgoal em { font-style: normal; color: #ff8f7a; font-family: var(--mono); }
  .qgoal em.ok { color: var(--green); }
  .endturn { width: 64px; height: 64px; border-radius: 50%; flex: none; border: 2px solid #ffeab0; background: radial-gradient(circle at 40% 30%, #ffe28e, #d59a2c 60%, #8a5a12); color: #3a2507; font: 700 13px/1.15 var(--body); box-shadow: 0 0 0 2px #4e3207, 0 0 18px rgba(255, 200, 80, .55); }
  .bnav { display: grid; grid-template-columns: repeat(6, 1fr); padding-inline: 16px; background: linear-gradient(#1c2438, #0c101a); border-top: 1px solid #3a4666; box-shadow: 0 -4px 14px rgba(0,0,0,.5); }
  .bnav button { display: grid; justify-items: center; gap: 1px; padding: 6px 0 8px; background: none; border: 0; }
  .bnav .ic { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 40% 30%, #4b5b82, #1b2338 70%); border: 2px solid #6d7ba0; box-shadow: 0 2px 6px rgba(0,0,0,.6); }
  .bnav .ic svg { width: 26px; height: 26px; }
  .bnav span { font: 13px var(--display); color: #e3e7f0; text-shadow: 0 1px 2px #000; }
  .bnav button:hover .ic { border-color: var(--gold); }

  /* ---------- 모달 (장식 패널) ---------- */
  #modal { position: fixed; inset: 0; background: rgba(4, 6, 12, .66); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 30; }
  .dlg { width: min(560px, 100%); max-height: calc(100% - 24px); display: flex; flex-direction: column; background: linear-gradient(#2a3350, #1b2236); border: 1px solid #6b7aa0; box-shadow: 0 0 0 1px #0a0d16, 0 0 0 3px #3b4766, 0 20px 50px rgba(0,0,0,.7); }
  .dlg.wide { width: min(820px, 100%); }
  #modalHead { position: relative; display: flex; align-items: center; justify-content: center; min-height: 48px; background: linear-gradient(#56678f, #2e3a58 55%, #243049); border-bottom: 1px solid #0a0d16; box-shadow: inset 0 1px 0 rgba(255,255,255,.2); }
  #modalTitle { font: 22px var(--display); color: #fff; letter-spacing: .06em; text-shadow: 0 2px 3px #000; display: flex; align-items: center; gap: 14px; margin: 0; }
  #modalTitle::before, #modalTitle::after { content: ''; width: 16px; height: 16px; border: 3px solid #c8d0e6; border-right: 0; border-bottom: 0; transform: rotate(-45deg); opacity: .8; }
  #modalTitle::after { transform: rotate(135deg); }
  #modalClose { position: absolute; left: 0; top: 0; bottom: 0; width: 60px; border: 0; border-right: 1px solid #0a0d16; background: linear-gradient(#e0553f, #9b241a); color: #fff; font-size: 26px; line-height: 1; clip-path: polygon(0 0, 100% 0, 78% 100%, 0 100%); }
  .dlg-scroll { overflow-y: auto; padding: 18px 18px 14px; display: flex; flex-direction: column; gap: 14px; }
  #modalBody { display: flex; flex-direction: column; gap: 10px; }
  #modalBody h2 { font-size: 28px; line-height: 1.15; color: #fff; }
  #modalBody p { margin: 0; }
  .scripture { font-family: var(--display); font-size: 17px; line-height: 1.75; border-left: 2px solid var(--gold); padding-left: 14px; color: #f3ecd8; }
  .result { font-size: 16px; color: var(--gold-hi); }
  #modalBtns { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; padding: 14px 18px 18px; background: linear-gradient(rgba(64, 90, 140, .25), rgba(20, 26, 42, .3)); border-top: 1px solid #0a0d16; }
  #modalBtns:empty { display: none; }
  .blog { max-height: 46vh; overflow-y: auto; font-size: 13px; display: grid; gap: 3px; background: #0e1320; padding: 12px; border: 1px solid #2c3650; font-variant-numeric: tabular-nums; }
  .picklist { display: grid; gap: 6px; }
  .pick { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: linear-gradient(#2c3753, #1d2539); border: 1px solid var(--line); border-radius: 3px; }
  .pick b { flex: 1; text-align: left; }
  .pick:hover { border-color: var(--gold); }
  .pick > span:last-child { font: 600 13px var(--mono); color: var(--gold-hi); }
  .fld { font-size: 12px; color: var(--mute); letter-spacing: .04em; }
  select, input[type=range] { width: 100%; }
  select { background: #121827; color: var(--ink); border: 1px solid var(--line); border-radius: 3px; padding: 8px; }
  input[type=range] { accent-color: var(--gold); }
  .checks { display: flex; flex-wrap: wrap; gap: 6px 14px; }
  .checks label { display: inline-flex; gap: 6px; align-items: center; }
  .help { margin: 0; padding-left: 18px; display: grid; gap: 8px; color: #d5dae5; }
  .tablewrap { overflow-x: auto; }
  .roster { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .roster th, .roster td { padding: 6px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
  .roster th { color: var(--mute); font-weight: 400; }
  .roster tr.me td { color: var(--gold-hi); }
  .roster tr.dead { opacity: .45; }
  .oname { background: none; border: 0; padding: 0; font-weight: 700; text-decoration: underline dotted var(--mute); text-underline-offset: 3px; }
  .log { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 13px; }
  .log li.gold { color: var(--gold-hi); }
  .log li.bad { color: #ff9a86; }
  .log time { font: 500 10.5px var(--mono); color: var(--mute); margin-right: 8px; }
  #toast { position: fixed; left: 50%; top: calc(120px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); background: linear-gradient(#ffe08a, #d9a13a); color: #3a2507; padding: 9px 18px; border: 1px solid #ffeab0; font-weight: 700; z-index: 50; max-width: calc(100% - 32px); box-shadow: 0 0 0 2px #4e3207, 0 6px 16px rgba(0,0,0,.5); }

  /* 저장 */
  .title-btns { display: flex; flex-wrap: wrap; align-items: center; gap: 18px; }
  .slots { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .slot { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; background: #151b2b; border: 1px solid #2c3650; }
  .slot.empty { grid-template-columns: 1fr auto; opacity: .75; }
  .slot div { display: grid; gap: 1px; min-width: 0; }
  .slot small { font-size: 11.5px; }
  .slot-btns { display: flex !important; grid-auto-flow: column; gap: 8px; }
  .slot-btns .btn { padding: 6px 12px; }
  .codebox { display: grid; gap: 8px; padding: 12px; background: rgba(12, 16, 26, .6); border: 1px solid #3a4666; }
  .code-btns { display: flex; flex-wrap: wrap; gap: 8px; }
  #codeArea { width: 100%; background: #0b0e16; color: var(--ink); border: 1px solid var(--line); padding: 8px; font: 11px var(--mono); resize: vertical; }
  .warn { color: #ffb05c; }

  /* 초상화 */
  .pimg { position: relative; display: block; width: 100%; height: 100%; }
  .pimg > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .pimg > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 12%; }
  .lord-img > svg, .thumb > svg, .hc-img > svg, .pc-art > svg { width: 100%; height: 100%; display: block; }
  .thumb { display: inline-block; width: 36px; height: 44px; overflow: hidden; flex: none; border: 1px solid #56688f; background: #1b2233; }

  /* 정벌 창 */
  .pop-city { display: grid; grid-template-columns: 1fr 1.1fr; gap: 14px; }
  .pc-art { aspect-ratio: 3 / 4; max-width: 100%; border: 2px solid #56688f; overflow: hidden; background: #1b2233; }
  .pc-art.empty { display: grid; place-items: center; }
  .pc-cap { text-align: center; margin-top: 6px !important; }
  .pc-desc { font-size: 12px; margin-top: 4px !important; }
